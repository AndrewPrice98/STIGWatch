    eq: 2
  rationale: Domain controllers must require LDAP access signing. HKLM\SYSTEM\CurrentControlSet\Services\NTDS\Parameters\LDAPServerIntegrity must be 2. Applies to domain controllers only.
- stig_id: WN22-DC-000330
  facts: [domain_role, registry]
  na_if: *id019
  logic:
