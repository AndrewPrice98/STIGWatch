- stig_id: WN22-MS-000010
  facts: [domain_role, local_admins]
  na_if: *id020
  logic: {path: local_admins.count, ge: 0}
  result_if_true: Not_Reviewed
  result_if_false: Not_Reviewed
  observe: [local_admins.members]
  rationale: Only administrators responsible for the system may be members of the local Administrators group; the members are listed for the assessor. Not applicable to domain controllers.
- stig_id: WN22-MS-000020
  facts: [domain_role, registry]
  na_if:
    path: domain_role.role
    in: [dc, standalone]
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, LocalAccountTokenFilterPolicy, value]
    eq: 0
  rationale: Local administrator accounts must have their privileged token filtered to prevent elevated privileges from being used over the network on domain-joined member servers. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LocalAccountTokenFilterPolicy
    must be 0. Applies to domain-joined member servers only.
- stig_id: WN22-MS-000030
  facts: [domain_role, registry]
  na_if:
    path: domain_role.role
    in: [dc, standalone]
  logic:
    path: [registry, HKLM\SOFTWARE\Policies\Microsoft\Windows\System, EnumerateLocalUsers, value]
    eq: 0
  rationale: Local users on domain-joined member servers must not be enumerated. HKLM\SOFTWARE\Policies\Microsoft\Windows\System\EnumerateLocalUsers must be 0. Applies to domain-joined member servers only.
- stig_id: WN22-MS-000040
  facts: [domain_role, registry]
  na_if: *id020
  logic:
    path: [registry, HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Rpc, RestrictRemoteClients, value]
    eq: 1
  rationale: Must restrict unauthenticated Remote Procedure Call (RPC) clients from connecting to the RPC server on domain-joined member servers and standalone or nondomain-joined systems. HKLM\SOFTWARE\Policies\Microsoft\Windows
    NT\Rpc\RestrictRemoteClients must be 1. Not applicable to domain controllers.
- stig_id: WN22-MS-000050
  facts: [domain_role, registry]
  na_if:
    path: domain_role.role
    in: [dc, standalone]
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon, CachedLogonsCount, number]
    ge: 0
    le: 4
  rationale: Cached logon credentials (Winlogon CachedLogonsCount, REG_SZ) must be 4 or less on domain-joined member servers.
- stig_id: WN22-MS-000060
  facts: [domain_role, registry]
  na_if: *id020
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, RestrictRemoteSAM, value]
    eq: O:BAG:BAD:(A;;RC;;;BA)
  rationale: Must restrict remote calls to the Security Account Manager (SAM) to Administrators on domain-joined member servers and standalone or nondomain-joined systems. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictRemoteSAM
    must be O:BAG:BAD:(A;;RC;;;BA). Not applicable to domain controllers.
- stig_id: WN22-MS-000070
  facts: [domain_role, user_rights]
  na_if: *id020
  logic:
    path: user_rights.SeNetworkLogonRight
    subset: [S-1-5-32-544, S-1-5-11]
  rationale: The SeNetworkLogonRight user right must only be assigned to Administrators, Authenticated Users. An application that needs the right with vendor documentation and ISSO approval is not visible
    on the host; the assessor records it. Not applicable to domain controllers.
- stig_id: WN22-MS-000080
  facts: [domain_role, user_rights]
  na_if: *id020
  logic:
    all:
    - {path: user_rights.SeDenyNetworkLogonRight, has_sid: S-1-5-32-546}
    - any:
      - &id021 {path: domain_role.role, eq: standalone}
      - all:
        - {path: user_rights.SeDenyNetworkLogonRight, has_sid: S-1-5-21-*-519}
        - {path: user_rights.SeDenyNetworkLogonRight, has_sid: S-1-5-21-*-512}
        - any:
          - {path: user_rights.SeDenyNetworkLogonRight, has_sid: S-1-5-114}
          - {path: user_rights.SeDenyNetworkLogonRight, has_sid: S-1-5-113}
  rationale: The SeDenyNetworkLogonRight user right must include Guests and, on domain-joined systems, Enterprise Admins, Domain Admins and Local account (S-1-5-113) or Local account and member of Administrators
    group (S-1-5-114). Domain Admins (S-1-5-21-*-512) and Enterprise Admins (S-1-5-21-*-519) are required on domain-joined systems only. Not applicable to domain controllers.
- stig_id: WN22-MS-000090
  facts: [domain_role, user_rights]
  na_if: *id020
  logic:
    all:
    - {path: user_rights.SeDenyBatchLogonRight, has_sid: S-1-5-32-546}
    - any:
      - *id021
      - all:
        - {path: user_rights.SeDenyBatchLogonRight, has_sid: S-1-5-21-*-519}
        - {path: user_rights.SeDenyBatchLogonRight, has_sid: S-1-5-21-*-512}
  rationale: The SeDenyBatchLogonRight user right must include Guests and, on domain-joined systems, Enterprise Admins and Domain Admins. Domain Admins (S-1-5-21-*-512) and Enterprise Admins (S-1-5-21-*-519)
    are required on domain-joined systems only. Not applicable to domain controllers.
- stig_id: WN22-MS-000100
  facts: [domain_role, user_rights]
  na_if: *id020
  logic:
    any:
    - all:
      - {path: domain_role.role, eq: member}
      - {path: user_rights.SeDenyServiceLogonRight, has_sid: S-1-5-21-*-519}
      - {path: user_rights.SeDenyServiceLogonRight, has_sid: S-1-5-21-*-512}
    - all:
      - *id021
      - {path: user_rights.SeDenyServiceLogonRight, empty: true}
  rationale: The SeDenyServiceLogonRight user right must include Enterprise Admins and Domain Admins on domain-joined member servers and must be empty on standalone systems. Not applicable to domain controllers.
- stig_id: WN22-MS-000110
  facts: [domain_role, user_rights]
  na_if: *id020
  logic:
    all:
    - {path: user_rights.SeDenyInteractiveLogonRight, has_sid: S-1-5-32-546}
    - any:
      - *id021
      - all:
        - {path: user_rights.SeDenyInteractiveLogonRight, has_sid: S-1-5-21-*-519}
        - {path: user_rights.SeDenyInteractiveLogonRight, has_sid: S-1-5-21-*-512}
  rationale: The SeDenyInteractiveLogonRight user right must include Guests and, on domain-joined systems, Enterprise Admins and Domain Admins. Domain Admins (S-1-5-21-*-512) and Enterprise Admins (S-1-5-21-*-519)
    are required on domain-joined systems only. Not applicable to domain controllers.
- stig_id: WN22-MS-000120
  facts: [domain_role, user_rights]
  na_if: *id020
  logic:
    all:
    - {path: user_rights.SeDenyRemoteInteractiveLogonRight, has_sid: S-1-5-32-546}
    - any:
      - *id021
      - all:
        - {path: user_rights.SeDenyRemoteInteractiveLogonRight, has_sid: S-1-5-21-*-519}
        - {path: user_rights.SeDenyRemoteInteractiveLogonRight, has_sid: S-1-5-21-*-512}
        - {path: user_rights.SeDenyRemoteInteractiveLogonRight, has_sid: S-1-5-113}
  rationale: The SeDenyRemoteInteractiveLogonRight user right must include Guests and, on domain-joined systems, Enterprise Admins, Domain Admins and Local account (S-1-5-113). Domain Admins (S-1-5-21-*-512)
    and Enterprise Admins (S-1-5-21-*-519) are required on domain-joined systems only. Not applicable to domain controllers.
- stig_id: WN22-MS-000130
  facts: [domain_role, user_rights]
  na_if: *id020
  logic: {path: user_rights.SeEnableDelegationPrivilege, empty: true}
  rationale: The SeEnableDelegationPrivilege user right must not be assigned to any account or group. Not applicable to domain controllers.
- stig_id: WN22-MS-000140
  facts: [domain_role, services, device_guard, registry]
  na_if:
    any:
    - {path: domain_role.role, ne: member}
    - path: [services, MSExchangeServiceHost, present]
      eq: true
  logic: {path: device_guard.security_services_running, contains: 1}
  observe:
  - [registry, HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard, LsaCfgFlags, value]
  rationale: Credential Guard must be running (Win32_DeviceGuard SecurityServicesRunning includes 1) on domain-joined member servers. Not applicable to domain controllers, standalone systems and Exchange
    servers (MSExchangeServiceHost present).
- stig_id: WN22-PK-000010
  facts: [certificates]
  logic: {path: certificates.root_dod_subjects, empty: false}
  result_if_true: Not_Reviewed
  result_if_false: Not_Reviewed
  rationale: 'The DoD Root CA certificates in the Trusted Root store are listed as supporting evidence only: which certificates are current and required depends on DoD PKE guidance and the network, so the
    assessor decides.'
- stig_id: WN22-PK-000020
  facts: [certificates]
  logic: {path: certificates.interoperability, empty: false}
  result_if_true: Not_Reviewed
  result_if_false: Not_Reviewed
  rationale: 'The DoD Interoperability Root CA cross-certificates in the Untrusted store are listed as supporting evidence only: which certificates are current and required depends on DoD PKE guidance and
    the network, so the assessor decides.'
- stig_id: WN22-PK-000030
  facts: [certificates]
  logic: {path: certificates.cceb_interoperability, empty: false}
  result_if_true: Not_Reviewed
  result_if_false: Not_Reviewed
  rationale: 'The US DoD CCEB Interoperability Root CA cross-certificates in the Untrusted store are listed as supporting evidence only: which certificates are current and required depends on DoD PKE guidance
    and the network, so the assessor decides.'
- stig_id: WN22-SO-000010
  facts: [security_policy]
  logic: {path: security_policy.system_access.EnableGuestAccount, eq: 0}
  rationale: The built-in Guest account must be disabled (EnableGuestAccount = 0).
- stig_id: WN22-SO-000020
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, LimitBlankPasswordUse, value]
    eq: 1
  rationale: Must prevent local accounts with blank passwords from being used from the network. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LimitBlankPasswordUse must be 1.
- stig_id: WN22-SO-000030
  facts: [security_policy]
  logic: {path: security_policy.administrator_renamed, eq: true}
  rationale: The built-in Administrator account must be renamed (NewAdministratorName other than "Administrator").
- stig_id: WN22-SO-000040
  facts: [security_policy]
  logic: {path: security_policy.guest_renamed, eq: true}
  rationale: The built-in Guest account must be renamed (NewGuestName other than "Guest").
- stig_id: WN22-SO-000050
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, SCENoApplyLegacyAuditPolicy, value]
    eq: 1
  rationale: Must force audit policy subcategory settings to override audit policy category settings. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\SCENoApplyLegacyAuditPolicy must be 1.
- stig_id: WN22-SO-000060
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters, RequireSignOrSeal, value]
    eq: 1
  rationale: 'Setting Domain member: Digitally encrypt or sign secure channel data (always) must be configured to Enabled. HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireSignOrSeal must
    be 1.'
- stig_id: WN22-SO-000070
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters, SealSecureChannel, value]
    eq: 1
  rationale: 'Setting Domain member: Digitally encrypt secure channel data (when possible) must be configured to Enabled. HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SealSecureChannel must
    be 1.'
- stig_id: WN22-SO-000080
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters, SignSecureChannel, value]
    eq: 1
  rationale: 'Setting Domain member: Digitally sign secure channel data (when possible) must be configured to Enabled. HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\SignSecureChannel must be
    1.'
- stig_id: WN22-SO-000090
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters, DisablePasswordChange, value]
    eq: 0
  rationale: Computer account password must not be prevented from being reset. HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\DisablePasswordChange must be 0.
- stig_id: WN22-SO-000100
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters, MaximumPasswordAge, value]
    ge: 1
    le: 30
  rationale: The machine account password maximum age (Netlogon MaximumPasswordAge) must be 1 to 30 days.
- stig_id: WN22-SO-000110
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters, RequireStrongKey, value]
    eq: 1
  rationale: Must be configured to require a strong session key. HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RequireStrongKey must be 1.
- stig_id: WN22-SO-000120
  facts: [registry]
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, InactivityTimeoutSecs, value]
    ge: 1
    le: 900
  rationale: The machine inactivity limit (InactivityTimeoutSecs) must be 1 to 900 seconds (0 disables it).
- stig_id: WN22-SO-000130
  facts: [registry]
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, LegalNoticeText, value]
    dod_banner: true
  rationale: The legal notice text (LegalNoticeText) must be the Standard Mandatory DoD Notice and Consent Banner (compared ignoring whitespace).
- stig_id: WN22-SO-000150
  facts: [registry]
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon, scremoveoption, value]
    in: ['1', '2']
  rationale: Smart card removal must lock the workstation or force logoff (scremoveoption "1" or "2"). A documented ISSO exception is not visible on the host; the assessor records it.
- stig_id: WN22-SO-000160
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters, RequireSecuritySignature, value]
    eq: 1
  rationale: 'Setting Microsoft network client: Digitally sign communications (always) must be configured to Enabled. HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\RequireSecuritySignature
    must be 1.'
- stig_id: WN22-SO-000170
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters, EnableSecuritySignature, value]
    eq: 1
  rationale: 'Setting Microsoft network client: Digitally sign communications (if server agrees) must be configured to Enabled. HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnableSecuritySignature
    must be 1.'
- stig_id: WN22-SO-000180
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters, EnablePlainTextPassword, value]
    eq: 0
  rationale: Unencrypted passwords must not be sent to third-party Server Message Block (SMB) servers. HKLM\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters\EnablePlainTextPassword must be
    0.
- stig_id: WN22-SO-000190
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters, RequireSecuritySignature, value]
    eq: 1
  rationale: 'Setting Microsoft network server: Digitally sign communications (always) must be configured to Enabled. HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\RequireSecuritySignature
    must be 1.'
- stig_id: WN22-SO-000200
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters, EnableSecuritySignature, value]
    eq: 1
  rationale: 'Setting Microsoft network server: Digitally sign communications (if client agrees) must be configured to Enabled. HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\EnableSecuritySignature
    must be 1.'
- stig_id: WN22-SO-000210
  facts: [security_policy]
  logic: {path: security_policy.system_access.LSAAnonymousNameLookup, eq: 0}
  rationale: Anonymous SID/Name translation (LSAAnonymousNameLookup) must be disabled.
- stig_id: WN22-SO-000220
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, RestrictAnonymousSAM, value]
    eq: 1
  rationale: Must not allow anonymous enumeration of Security Account Manager (SAM) accounts. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymousSAM must be 1.
- stig_id: WN22-SO-000230
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, RestrictAnonymous, value]
    eq: 1
  rationale: Must not allow anonymous enumeration of shares. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RestrictAnonymous must be 1.
- stig_id: WN22-SO-000240
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, EveryoneIncludesAnonymous, value]
    eq: 0
  rationale: Must be configured to prevent anonymous users from having the same permissions as the Everyone group. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\EveryoneIncludesAnonymous must be 0.
- stig_id: WN22-SO-000250
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters, RestrictNullSessAccess, value]
    eq: 1
  rationale: Must restrict anonymous access to Named Pipes and Shares. HKLM\SYSTEM\CurrentControlSet\Services\LanManServer\Parameters\RestrictNullSessAccess must be 1.
- stig_id: WN22-SO-000260
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, UseMachineId, value]
    eq: 1
  rationale: Services using Local System that use Negotiate when reverting to NTLM authentication must use the computer identity instead of authenticating anonymously. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\UseMachineId
    must be 1.
- stig_id: WN22-SO-000270
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0, allownullsessionfallback, value]
    eq: 0
  rationale: Must prevent NTLM from falling back to a Null session. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\allownullsessionfallback must be 0.
- stig_id: WN22-SO-000280
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa\pku2u, AllowOnlineID, value]
    eq: 0
  rationale: Must prevent PKU2U authentication using online identities. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\pku2u\AllowOnlineID must be 0.
- stig_id: WN22-SO-000290
  facts: [registry]
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters, SupportedEncryptionTypes, value]
    eq: 2147483640
  rationale: Kerberos encryption types must be configured to prevent the use of DES and RC4 encryption suites. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters\SupportedEncryptionTypes
    must be 0x7ffffff8 (2147483640).
- stig_id: WN22-SO-000300
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, NoLMHash, value]
    eq: 1
  rationale: Must be configured to prevent the storage of the LAN Manager hash of passwords. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\NoLMHash must be 1.
- stig_id: WN22-SO-000310
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa, LmCompatibilityLevel, value]
    eq: 5
  rationale: LAN Manager authentication level must be configured to send NTLMv2 response only and to refuse LM and NTLM. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\LmCompatibilityLevel must be 5.
- stig_id: WN22-SO-000320
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LDAP, LDAPClientIntegrity, value]
    eq: 1
  unmet_if:
    any:
    - path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LDAP, LDAPClientIntegrity, value]
      unset: true
    - path: [registry, HKLM\SYSTEM\CurrentControlSet\Services\LDAP, LDAPClientIntegrity, value]
      eq: 0
  rationale: LDAP client signing must at least be negotiated (LDAPClientIntegrity = 1). Not set or 0 is a finding; 2 (require signing) is stricter than the check text's value and needs review.
- stig_id: WN22-SO-000330
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0, NTLMMinClientSec, value]
    eq: 537395200
  rationale: Session security for NTLM SSP-based clients must be configured to require NTLMv2 session security and 128-bit encryption. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\NTLMMinClientSec must
    be 0x20080000 (537395200).
- stig_id: WN22-SO-000340
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0, NTLMMinServerSec, value]
    eq: 537395200
  rationale: Session security for NTLM SSP-based servers must be configured to require NTLMv2 session security and 128-bit encryption. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\MSV1_0\NTLMMinServerSec must
    be 0x20080000 (537395200).
- stig_id: WN22-SO-000350
  facts: [registry]
  logic:
    path: [registry, HKLM\SOFTWARE\Policies\Microsoft\Cryptography, ForceKeyProtection, value]
    eq: 2
  rationale: Users must be required to enter a password to access private keys stored on the computer. HKLM\SOFTWARE\Policies\Microsoft\Cryptography\ForceKeyProtection must be 2.
- stig_id: WN22-SO-000360
  facts: [registry, services]
  na_if:
    path: [services, SPTimerV4, status]
    eq: Running
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy, Enabled, value]
    eq: 1
  rationale: Must be configured to use FIPS-compliant algorithms for encryption, hashing, and signing. HKLM\SYSTEM\CurrentControlSet\Control\Lsa\FIPSAlgorithmPolicy\Enabled must be 1. Not applicable when
    SharePoint runs on the host (SharePoint Timer service SPTimerV4 running).
- stig_id: WN22-SO-000370
  facts: [registry]
  logic:
    path: [registry, HKLM\SYSTEM\CurrentControlSet\Control\Session Manager, ProtectionMode, value]
    eq: 1
  rationale: Default permissions of global system objects must be strengthened. HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\ProtectionMode must be 1.
- stig_id: WN22-SO-000380
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, FilterAdministratorToken, value]
    eq: 1
  rationale: User Account Control (UAC) approval mode for the built-in Administrator must be enabled. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\FilterAdministratorToken must be 1. UAC
    requirements are not applicable to Server Core installations.
- stig_id: WN22-SO-000390
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, EnableUIADesktopToggle, value]
    eq: 0
  rationale: UIAccess applications must not be allowed to prompt for elevation without using the secure desktop. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableUIADesktopToggle must
    be 0. UAC requirements are not applicable to Server Core installations.
- stig_id: WN22-SO-000400
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, ConsentPromptBehaviorAdmin, value]
    in: [1, 2]
  rationale: User Account Control (UAC) must, at a minimum, prompt administrators for consent on the secure desktop. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorAdmin
    must be 1 or 2. UAC requirements are not applicable to Server Core installations.
- stig_id: WN22-SO-000410
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, ConsentPromptBehaviorUser, value]
    eq: 0
  rationale: User Account Control (UAC) must automatically deny standard user requests for elevation. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\ConsentPromptBehaviorUser must be 0.
    UAC requirements are not applicable to Server Core installations.
- stig_id: WN22-SO-000420
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, EnableInstallerDetection, value]
    eq: 1
  rationale: User Account Control (UAC) must be configured to detect application installations and prompt for elevation. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableInstallerDetection
    must be 1. UAC requirements are not applicable to Server Core installations.
- stig_id: WN22-SO-000430
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, EnableSecureUIAPaths, value]
    eq: 1
  rationale: User Account Control (UAC) must only elevate UIAccess applications that are installed in secure locations. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableSecureUIAPaths
    must be 1. UAC requirements are not applicable to Server Core installations.
- stig_id: WN22-SO-000440
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, EnableLUA, value]
    eq: 1
  rationale: User Account Control (UAC) must run all administrators in Admin Approval Mode, enabling UAC. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLUA must be 1. UAC requirements
    are not applicable to Server Core installations.
- stig_id: WN22-SO-000450
  facts: [os, registry]
  na_if: *id022
  logic:
    path: [registry, HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System, EnableVirtualization, value]
    eq: 1
  rationale: User Account Control (UAC) must virtualize file and registry write failures to per-user locations. HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableVirtualization must be
    1. UAC requirements are not applicable to Server Core installations.
- stig_id: WN22-UC-000010
  facts: [registry]
  logic:
    any:
    - path: [registry, HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments, SaveZoneInformation, value]
      unset: true
    - path: [registry, HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments, SaveZoneInformation, value]
      eq: 2
  unmet_if:
    path: [registry, HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Attachments, SaveZoneInformation, value]
    eq: 1
  result_if_true: Not_Reviewed
  rationale: Zone information must be preserved (HKCU SaveZoneInformation not set or 2) for every interactive user profile. Only the profile of the account that ran the collector is read, so a value of
    1 is a finding but a compliant value does not cover the other profiles.
