    eq: 0
  rationale: Domain controllers must be configured to allow reset of machine account passwords. HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters\RefusePasswordChange must be 0. Applies to domain
    controllers only.
- stig_id: WN22-DC-000340
  facts: [domain_role, user_rights]
  na_if: *id019
  logic:
    path: user_rights.SeNetworkLogonRight
    subset: [S-1-5-32-544, S-1-5-11, S-1-5-9]
  rationale: The SeNetworkLogonRight user right must only be assigned to Administrators, Authenticated Users, Enterprise Domain Controllers. An application that needs the right with vendor documentation
    and ISSO approval is not visible on the host; the assessor records it. Applies to domain controllers only; the effective policy on the domain controller is read.
