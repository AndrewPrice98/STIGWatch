name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      # -rs names every skipped test in the log.
      - name: Tests
        working-directory: backend
        run: python -m pytest -q -rs
      # The generated-file test that runs real GNU grep is skipped on Windows; here it must run.
      - name: The sshd grep test ran (not skipped) on Linux
        working-directory: backend
        run: |
          python -m pytest -v -rs tests/test_remediation.py::test_sshd_include_check_behaves_on_real_files | tee sshd-test.log
          grep -q "test_sshd_include_check_behaves_on_real_files PASSED" sshd-test.log
      - name: Benchmark catalog is current
        working-directory: backend
        run: python -m stigwatch benchmarks --check
      - name: Coverage tables are current
        working-directory: backend
        run: python -m stigwatch coverage --check
      - name: Demo fleet fixture is current
        working-directory: backend
        run: python scripts/build_demo.py --check
      - name: Demo fleet seeds and matches the fixture
        working-directory: backend
        run: python -m stigwatch demo --check

  # Runs the real Ubuntu collector under dash and mawk, as a normal user and as root,
  # and keeps both outputs as artifacts.
  linux-collector:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Use mawk as awk (the Ubuntu default)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mawk
          sudo update-alternatives --set awk /usr/bin/mawk
          readlink -f "$(command -v awk)"
          readlink -f /bin/sh
      - name: Collector tests under dash and mawk
        working-directory: backend
        env:
          STIGWATCH_TEST_AWK: mawk
          STIGWATCH_RUN_COLLECTOR: "1"
        run: python -m pytest -q -rs tests/test_linux_checks.py tests/test_linux_hardening.py -k "collector"
      - name: Run the collector as a normal user
        timeout-minutes: 10
        run: sh collectors/collect-linux.sh -r -o out-user.json
      # The documented command, exactly: default output file, then collect-parse on it.
      - name: Run the collector as root (sudo sh collectors/collect-linux.sh)
        timeout-minutes: 10
        run: |
          sudo sh collectors/collect-linux.sh
          sudo chown "$(id -u):$(id -g)" stigwatch-linux-*.json
          mv stigwatch-linux-*.json out.json
      - name: Validate the root output (collect-parse linux out.json --min-ok 40)
        working-directory: backend
        run: python -m stigwatch collect-parse linux ../out.json --min-ok 40
      - name: Validate the normal-user output
        working-directory: backend
        run: python -m stigwatch collect-parse linux ../out-user.json --min-ok 30
      - name: Scan the root output
        working-directory: backend
        run: python -m stigwatch scan ../out.json
      - name: Keep the collector output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-collector-output
          path: |
            out.json
            out-*.json
          if-no-files-found: warn
          retention-days: 14

  # Runs the real Windows collector on Windows Server 2022, elevated (the runner's default),
  # under PowerShell 7 and Windows PowerShell 5.1, and keeps both outputs as artifacts.
  windows-collector:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Collector tests (Windows PowerShell 5.1)
        working-directory: backend
        env:
          STIGWATCH_RUN_COLLECTOR: "1"
        run: python -m pytest -q -rs tests/test_windows_checks.py -k collector
      - name: Run the collector under PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          pwsh -NoProfile -ExecutionPolicy Bypass -File collectors/collect-windows.ps1 -OutFile out-pwsh.json -RedactNames
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the collector under Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          powershell -NoProfile -ExecutionPolicy Bypass -File collectors/collect-windows.ps1 -OutFile out-ps51.json -RedactNames
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate the PowerShell 7 output
        working-directory: backend
        run: python -m stigwatch collect-parse windows ../out-pwsh.json --min-ok 20 --require security_policy,user_rights,audit_policy,registry,features,domain_role,local_accounts,acls
      - name: Validate the Windows PowerShell 5.1 output
        working-directory: backend
        run: python -m stigwatch collect-parse windows ../out-ps51.json --min-ok 20 --require security_policy,user_rights,audit_policy,registry,features,domain_role,local_accounts,acls
      - name: Audit policy was read locale-independently (auditpol /backup)
        working-directory: backend
        shell: python
        run: |
          import json
          for name in ("pwsh", "ps51"):
              fact = json.load(open(f"../out-{name}.json", encoding="utf-8"))["facts"]["audit_policy"]
              assert fact["status"] == "ok", (name, fact.get("reason"))
              assert fact["value"]["source"] == "backup", (name, fact["command"])
              print(name, "audit_policy source:", fact["value"]["source"])
      - name: Scan the PowerShell 7 output
        working-directory: backend
        run: python -m stigwatch scan ../out-pwsh.json
      - name: Scan the Windows PowerShell 5.1 output
        working-directory: backend
        run: python -m stigwatch scan ../out-ps51.json
      - name: Summarise the outputs as annotations
        if: always()
        working-directory: backend
        shell: python
        run: |
          import json, os, sys
          sys.path.insert(0, os.getcwd())
          from stigwatch.checks import engine
          from stigwatch.facts import windows
          for name in ("pwsh", "ps51"):
              path = os.path.join("..", f"out-{name}.json")
              if not os.path.exists(path):
                  print(f"::warning title=windows collector {name}::no output file")
                  continue
              data = json.load(open(path, encoding="utf-8"))
              info = windows.summary(data)
              counts = engine.status_counts(engine.evaluate(data))
              lines = [f"PowerShell {data.get('powershell')}, privileged {data.get('privileged')}: "
                       f"{info['ok']} of {info['facts']} facts read",
                       "scan: " + ", ".join(f"{k} {v}" for k, v in counts.items())]
              raw = data["facts"]
              for fid in ("audit_policy", "features"):
                  if raw.get(fid, {}).get("status") == "ok":
                      lines.append(f"{fid} source: {raw[fid]['value'].get('source')}")
              lines += [f"unavailable {k}: {v}" for k, v in sorted(info["unavailable"].items())]
              print(f"::notice title=windows collector {name}::" + "%0A".join(lines))
      - name: Keep the collector output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-collector-output
          path: out-*.json
          if-no-files-found: warn
          retention-days: 14

  # Parses every generated PowerShell script with the PowerShell AST and runs it in its default
  # dry-run mode (nothing is applied: -Apply is never passed).
  remediation-scripts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Generate remediation for the demo hosts
        working-directory: backend
        run: python scripts/generate_remediation_samples.py ../remediation-out
      - name: Parse the generated scripts (PowerShell AST)
        shell: pwsh
        run: |
          $failed = 0
          foreach ($file in Get-ChildItem remediation-out -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed++
              foreach ($e in $errors) { Write-Host "::error file=$($file.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            } else { Write-Host "parsed $($file.Name)" }
          }
          if ($failed -gt 0) { exit 1 }
      - name: Dry-run the generated scripts (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem remediation-out -Filter *.ps1) {
            powershell -NoProfile -ExecutionPolicy Bypass -File $file.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$($file.Name) dry run exited with $LASTEXITCODE"; exit 1 }
            Write-Host "dry run ok $($file.Name)"
          }

  # Syntax-checks and lints the generated Ansible playbooks (demo hosts and an all-rules playbook).
  ansible-playbooks:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt ansible-core ansible-lint
      - name: Install the ansible.posix collection
        run: ansible-galaxy collection install ansible.posix
      - name: Generate remediation for the demo hosts
        working-directory: backend
        run: python scripts/generate_remediation_samples.py ../remediation-out
      - name: ansible-playbook --syntax-check
        run: |
          for f in remediation-out/*.yml; do
            echo "== $f"
            ansible-playbook -i localhost, -e stigwatch_target=localhost --syntax-check "$f"
          done
      # ansible-lint loads each play without extra vars, so the required stigwatch_target is
      # filled in on a copy (the playbooks themselves keep the required variable).
      - name: ansible-lint
        run: |
          mkdir lint-copy
          for f in remediation-out/*.yml; do sed 's/{{ stigwatch_target }}/localhost/' "$f" > "lint-copy/$(basename "$f")"; done
          ansible-lint lint-copy/*.yml

  frontend:
    # The React dashboard: unit tests (node --test), a production build and npm audit.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # Drives the built dashboard against the demo API in a real browser: guests are read-only
  # and a rule that lost visibility is never reported as fixed.
  e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Start the demo API and the built dashboard
        run: |
          (cd backend && nohup python -m stigwatch demo --serve --db "$RUNNER_TEMP/demo.db" --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &)
          nohup npx vite preview --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:4173/api/health && break; sleep 1; done
      - name: Smoke test
        working-directory: e2e
        env:
          STIGWATCH_URL: http://127.0.0.1:4173
        run: node smoke.mjs
      - name: Server logs
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - name: Audit root requirements (Vercel function)
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action v2 lists a pull request's commits through the API.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
